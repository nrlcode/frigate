name: Build Test Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit SHA to build (blank uses current ref)"
        required: false
        default: ""
      custom_tag:
        description: "Optional extra tag to publish (example: snapshot-test)"
        required: false
        default: ""
  push:
    branches:
      - snapshot-only
      - history-zoom-pan-only
    paths-ignore:
      - "docs/**"

concurrency:
  group: build-test-image-${{ github.event.inputs.source_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.source_ref || github.ref }}
          persist-credentials: false

      - name: Prepare image metadata
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          raw_ref="${{ github.event.inputs.source_ref }}"
          if [ -z "$raw_ref" ]; then
            raw_ref="${GITHUB_REF_NAME}"
          fi
          raw_ref="${raw_ref#refs/heads/}"

          branch_slug="$(echo "$raw_ref" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#^[.-]+##; s#[-.]+$##')"
          if [ -z "$branch_slug" ]; then
            branch_slug="manual"
          fi

          short_sha="$(git rev-parse --short=7 HEAD)"
          image_repo="ghcr.io/${{ github.repository_owner }}/frigate-test"

          tags="${image_repo}:branch-${branch_slug}\n${image_repo}:branch-${branch_slug}-${short_sha}"

          custom_tag="${{ github.event.inputs.custom_tag }}"
          if [ -n "$custom_tag" ]; then
            tags="${tags}\n${image_repo}:${custom_tag}"
          fi

          {
            echo "branch_slug=$branch_slug"
            echo "short_sha=$short_sha"
            echo "image_repo=$image_repo"
            echo "tags<<EOF"
            printf '%b\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Show build tags
        run: |
          echo "Branch slug: ${{ steps.prep.outputs.branch_slug }}"
          echo "Commit: ${{ steps.prep.outputs.short_sha }}"
          echo "Publishing tags:"
          echo "${{ steps.prep.outputs.tags }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version file
        run: make version

      - name: Build and push amd64 test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/main/Dockerfile
          target: frigate
          platforms: linux/amd64
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.prep.outputs.image_repo }}:cache-${{ steps.prep.outputs.branch_slug }}-amd64
          cache-to: type=registry,ref=${{ steps.prep.outputs.image_repo }}:cache-${{ steps.prep.outputs.branch_slug }}-amd64,mode=max
