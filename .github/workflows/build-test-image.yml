name: Build Test Image

on:
  workflow_dispatch:
  push:
    branches:
      - history-ui-test

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Generate Frigate version metadata
        run: |
          echo "VERSION = \"0.18.0-${GITHUB_SHA::7}\"" > frigate/version.py
          echo "VITE_GIT_COMMIT_HASH=${GITHUB_SHA::7}" > web/.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/main/Dockerfile
          target: frigate
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frigate-test:latest
            ghcr.io/${{ github.repository_owner }}/frigate-test:${{ github.sha }}
